name: quickmd
description: "QuickMD - Open .md or .txt from File Manager and edit WYSIWYG. No hassle."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.11.4
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  
  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  
  # Navigation
  go_router: ^14.2.0
  
  # File handling
  file_picker: ^8.0.0
  path_provider: ^2.1.4
  path: ^1.9.0
  
  # Editor
  flutter_quill: ^11.5.0
  flutter_markdown: ^0.7.3+1
  markdown: ^7.2.2
  
  # Local storage
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  
  # Utils
  uuid: ^4.4.0
  collection: ^1.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mockito: ^5.4.4
  build_runner: ^2.4.13
  riverpod_generator: ^2.4.0
  isar_generator: ^3.1.0+1

flutter:
  uses-material-design: true
